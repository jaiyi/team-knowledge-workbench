# Template only: replace all .invalid names, loopback port and certificate paths after approval.
# Host identity is fixed here; do not pass client-supplied Forwarded or X-Forwarded-*.
server {
    listen 80;
    server_name workbench.example.invalid;
    return 421;
}

server {
    listen 443 ssl;
    server_name workbench.example.invalid;
    ssl_certificate <approved-certificate-chain-path>;
    ssl_certificate_key <approved-private-key-path>;

    if ($host != workbench.example.invalid) { return 421; }
    if ($http_forwarded != '') { return 421; }
    if ($http_x_forwarded_host != '') { return 421; }
    if ($http_x_forwarded_proto != '') { return 421; }
    if ($http_x_forwarded_for != '') { return 421; }

    location = /auth {
        proxy_pass http://127.0.0.1:3411;
        proxy_pass_request_headers off;
        proxy_set_header Host workbench.example.invalid;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Workbench-CSRF $http_x_workbench_csrf;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:3411;
        proxy_pass_request_headers off;
        proxy_set_header Host workbench.example.invalid;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Workbench-CSRF $http_x_workbench_csrf;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    }

    location / { return 404; }
}
