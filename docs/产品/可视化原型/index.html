<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队知识工程 · 共创产品概念稿</title>
<style>
  :root { font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; color:#192b2a; background:#f2f5f1; --green:#176859; --ink:#192b2a; --muted:#647670; --line:#dce6df; --warn:#80561e; --red:#9c443a; }
  * { box-sizing:border-box; }
  body { margin:0; line-height:1.55; }
  button,input,textarea,select { font:inherit; }
  button { cursor:pointer; }
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:3px solid #65c9a9; outline-offset:2px; }
  .app { min-height:100vh; display:grid; grid-template-columns:254px minmax(0,1fr); }
  .rail { background:#102a2d; color:#e6efe9; padding:26px 16px; display:flex; flex-direction:column; gap:22px; min-height:100vh; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:750; padding:0 7px; line-height:1.25; }
  .logo { width:34px; height:34px; display:grid; place-items:center; background:#9bdabb; color:#154338; border-radius:10px; }
  .tiny { font-size:11px; } .muted { color:var(--muted); } .small { font-size:12px; }
  .rail .muted { color:#aecbc4; font-weight:400; }
  .section-label { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#94b0a9; margin:12px 9px 7px; }
  .nav { display:grid; gap:4px; }
  .nav button { border:0; border-radius:9px; text-align:left; color:#c6d8d3; background:transparent; padding:11px 12px; font-size:13px; width:100%; }
  .nav button:hover,.nav button.active { background:#294a45; color:white; }
  .nav button.active { box-shadow:inset 3px 0 #a7debd; }
  .nav-group { padding:10px 0; border-bottom:1px solid #33544f; }
  .nav-group:last-child { border:0; }
  .nav-hint { font-size:11px; color:#aecbc4; padding:0 9px 7px; }
  .nav-group.host .nav button { color:#aecbc4; }
  .nav-group.host .nav button.active { color:#fff; }
  .entry-choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px; }
  .entry-choice { border:1px solid #cfe1d4; border-radius:11px; padding:15px; background:#f5faf6; min-width:0; }
  .entry-choice p { margin:5px 0 10px; }
  .entry-choice .btn { padding-left:0; text-align:left; }
  .entry-choice.wide { grid-column:span 2; background:#f9f9f1; border-color:#e3e4cf; }
  .entry-purpose { border-left:3px solid #83b79a; padding:11px 14px; background:#edf5ee; border-radius:0 10px 10px 0; margin-bottom:16px; font-size:13px; }
  .entry-purpose p { margin:5px 0 0; }
  .rail-note { margin-top:auto; border:1px solid #33544f; padding:13px; border-radius:11px; color:#b6cbc6; font-size:12px; }
  .workspace { min-width:0; }
  .top { background:white; border-bottom:1px solid var(--line); padding:17px 34px; display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:12px; }
  .banner { background:#fff8e5; border-bottom:1px solid #eddfba; color:#795a25; font-size:12px; padding:10px 34px; }
  main { max-width:1280px; padding:34px; margin:auto; outline:none; }
  h1,h2,h3,p { margin-top:0; } h1 { font-size:28px; letter-spacing:-.03em; margin-bottom:8px; } h2 { font-size:18px; margin-bottom:11px; } h3 { font-size:15px; margin-bottom:6px; }
  p { margin-bottom:11px; } .eyebrow { color:var(--green); font-size:11px; font-weight:800; letter-spacing:.12em; margin-bottom:8px; }
  .page-header { margin-bottom:22px; } .lead { font-size:14px; color:var(--muted); max-width:760px; }
  .grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px; }
  .span-12 { grid-column:span 12; } .span-8 { grid-column:span 8; } .span-7 { grid-column:span 7; } .span-6 { grid-column:span 6; } .span-5 { grid-column:span 5; } .span-4 { grid-column:span 4; }
  .card { background:white; border:1px solid var(--line); border-radius:15px; padding:22px; min-width:0; box-shadow:0 10px 30px rgba(19,53,39,.04); }
  .card.dark { color:white; background:#173635; border-color:#173635; }
  .card.dark .muted { color:#bdd0c9; }
  .card.tint { background:#e9f3ed; border-color:#c8e2d2; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .between { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:17px; }
  .btn { background:var(--green); color:white; border:1px solid transparent; border-radius:9px; padding:9px 13px; min-height:38px; font-weight:650; font-size:12px; display:inline-flex; align-items:center; justify-content:center; }
  .btn:hover:not(:disabled) { filter:brightness(.92); }
  .btn.secondary { background:white; color:var(--ink); border-color:#d6e1d9; }
  .btn.ghost { color:var(--green); background:transparent; border-color:#bcd4c6; }
  .btn.text { color:var(--green); background:transparent; padding:5px; min-height:0; }
  .btn.danger { color:var(--red); background:#faeae8; }
  .btn:disabled { opacity:.48; cursor:not-allowed; }
  .badge { background:#edf3ee; color:#476157; border-radius:100px; font-weight:700; font-size:11px; padding:4px 9px; display:inline-block; }
  .badge.good { background:#dff0e7; color:#19644f; } .badge.warn { background:#fbf0d8; color:var(--warn); } .badge.bad { background:#f9e9e7; color:var(--red); }
  .notice { background:#f0f5f1; color:#40584b; border-radius:10px; padding:12px 14px; font-size:12px; margin:13px 0; }
  .notice.warn { background:#fbf0d8; color:var(--warn); } .notice.bad { background:#faeae8; color:var(--red); } .notice.good { background:#e2f2e8; color:#17634d; }
  .scope { font-size:12px; background:#ecf4ef; border-radius:9px; padding:11px 13px; margin-bottom:18px; }
  .divider { height:1px; background:var(--line); margin:17px 0; }
  .field { width:100%; border:1px solid #d4e0d8; border-radius:9px; background:white; padding:10px 12px; font-size:13px; color:var(--ink); }
  .field + .field { margin-top:9px; } textarea.field { min-height:88px; resize:vertical; }
  .field-label { display:block; margin:12px 0 5px; font-size:12px; font-weight:700; }
  .item { padding:13px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .usage-summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:15px 0; }
  .usage-summary > div { border:1px solid #cfe1d4; background:#f6faf6; border-radius:11px; padding:17px; }
  .usage-summary strong { display:block; margin:6px 0; font-size:21px; }

  .usage-record > div { min-width:0; }
  .usage-record p { margin:6px 0; }
  .usage-record .actions { margin:0; flex-shrink:0; }
  .usage-stage { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; margin:14px 0; }
  .usage-stage > div { padding:11px; border:1px solid var(--line); background:#f7faf7; border-radius:9px; font-size:12px; }
  .usage-stage strong,.usage-stage span { display:block; }
  .usage-stage span { color:var(--muted); margin-top:4px; }
  .inbox-hero { background:linear-gradient(125deg,#e7f2e9,#f8f9ed); border-color:#c5ddcc; }
  .inbox-hero .between { align-items:flex-start; }
  .inbox-layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr); gap:18px; align-items:start; }
  .inbox-list { min-width:0; }
  .inbox-row { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .inbox-row > div { min-width:0; overflow-wrap:anywhere; }
  .inbox-row .actions { margin-top:0; flex-shrink:0; }
  .inbox-detail { border-left:1px solid #c5ddcc; padding-left:18px; min-width:0; overflow-wrap:anywhere; }
  .inbox-detail p { white-space:pre-wrap; }
  .inbox-limit { font-size:11px; color:var(--muted); margin-top:5px; }
  @media(max-width:760px) { .inbox-layout { grid-template-columns:1fr; } .inbox-detail { border-left:0; border-top:1px solid #c5ddcc; padding:17px 0 0; } .inbox-row { display:block; } .inbox-row .actions { margin-top:10px; } }
  .asset-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
  .asset-metric { border:1px solid var(--line); background:white; border-radius:13px; padding:19px 20px; }
  .asset-metric .eyebrow { margin-bottom:6px; }
  .asset-metric .total { display:flex; align-items:baseline; gap:7px; margin:3px 0 12px; }
  .asset-metric .total strong { font-size:39px; line-height:1.1; letter-spacing:-.05em; }
  .asset-metric .total span { color:var(--muted); font-size:12px; }
  .asset-metric .metric-row { display:flex; gap:16px; padding-top:11px; border-top:1px solid var(--line); }
  .asset-metric .metric-row > div { flex:1; min-width:0; }
  .asset-metric .metric-row strong { display:block; font-size:17px; line-height:1.3; }
  .asset-metric .metric-row span { color:var(--muted); font-size:11px; }
  .asset-feed { margin-top:15px; border-left:1px solid #d8e5dc; padding-left:18px; }
  .asset-entry { position:relative; padding:0 0 17px; }
  .asset-entry:last-child { padding-bottom:0; }
  .asset-entry::before { content:""; position:absolute; left:-23px; top:5px; width:9px; height:9px; background:#6ba98b; border-radius:50%; border:2px solid white; box-shadow:0 0 0 1px #bad7c4; }
  .asset-entry h3 { margin:2px 0 4px; font-size:14px; }
  .asset-entry p { margin:0; }
  .asset-inline { border:0; background:none; padding:0; color:var(--green); font-weight:700; text-align:left; text-decoration:underline; text-decoration-color:#a5cbbb; text-underline-offset:3px; }
  .asset-inline:hover { text-decoration-color:currentColor; }
  .business-lines { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:14px 0 19px; }
  .business-line { width:100%; text-align:left; border:1px solid #cfe1d4; background:#f4faf5; border-radius:12px; padding:15px; color:var(--ink); }
  .business-line strong,.business-line span { display:block; }
  .business-line span { color:var(--muted); font-size:12px; margin-top:5px; }
  .business-line.active,.business-project.active { border-color:var(--green); background:#e4f3e9; box-shadow:inset 3px 0 var(--green); }
  .business-map { border-top:1px solid var(--line); }
  .business-map-row { display:grid; grid-template-columns:minmax(180px,1.35fr) repeat(3,minmax(0,1fr)); gap:10px; padding:10px 0; align-items:stretch; border-bottom:1px solid var(--line); }
  .business-map-heading { padding:6px 0; color:var(--muted); font-size:11px; font-weight:700; }
  .business-project { width:100%; border:1px solid var(--line); border-radius:10px; background:#f7faf7; padding:11px; text-align:left; color:var(--ink); }
  .business-project strong,.business-project span { display:block; }
  .business-project span { font-size:11px; color:var(--muted); margin-top:4px; }
  .business-cell { border:1px solid #cfe1d4; background:#f0f8f2; border-radius:9px; padding:10px; font-size:12px; }
  .business-cell.pending { background:#faf6ec; border-style:dashed; border-color:#dec9a5; }
  .business-cell.off { border-color:transparent; background:#f7f9f7; color:#9aaba1; }
  .business-cell strong,.business-cell span { display:block; }
  .business-cell span { font-size:11px; color:var(--muted); margin-top:3px; }
  .business-cell .mobile-line { display:none; }
  .business-map-row.related .business-cell:not(.off) { box-shadow:0 0 0 1px #93c9a6; }
  .business-map-row.dim,.business-line.dim,.business-capability.dim { opacity:.53; }
  .business-capabilities { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; margin-top:12px; }
  .business-capability { background:#f7faf7; border:1px solid var(--line); border-radius:10px; padding:13px; }
  .business-capability p { margin:6px 0 0; }
  .business-capability .tiny { display:block; margin-top:7px; }
  .business-focus { margin-top:16px; border-top:1px solid var(--line); padding-top:16px; }
  .business-focus .actions { margin-top:9px; }
  .business-focus > p { margin-bottom:7px; }
  .radar-intro { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .radar-card { display:flex; flex-direction:column; gap:10px; }
  .radar-card .actions { margin-top:auto; }
  .radar-card p { margin-bottom:0; }
  .tool-filters { display:flex; gap:7px; flex-wrap:wrap; margin:12px 0; }
  .tool-list { max-height:460px; overflow:auto; border-top:1px solid var(--line); }
  .tool-list .item { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .tool-list .item.current { background:#f2f8f3; }
  .tool-list .item > div { min-width:0; overflow-wrap:anywhere; }
  .tool-search { display:flex; gap:8px; }
  .tool-search .field { flex:1; min-width:0; }
  .fact { display:grid; grid-template-columns:110px 1fr; gap:10px; padding:10px 0; border-bottom:1px solid #edf1ee; font-size:12px; }
  .fact:last-child { border-bottom:0; } .fact > span:first-child { color:var(--muted); }
  .quote { border-left:3px solid #95ccb0; background:#f5f9f5; border-radius:0 9px 9px 0; padding:12px 14px; font-size:13px; }
  .selectable { user-select:text; cursor:text; background:#f7faf6; border:1px solid var(--line); border-radius:10px; padding:15px; font-size:13px; }
  .selectable ::selection { background:#bce2cc; }
  .annotation { border:1px solid var(--line); border-radius:10px; padding:14px; font-size:12px; margin-top:10px; }
  .annotation:target { outline:2px solid #8bbf9a; } .anchor-meta { color:var(--muted); font-size:11px; word-break:break-all; }
  .steps { padding-left:17px; font-size:13px; } .steps li { padding:0 0 11px; }
  .creation-steps { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:9px; margin:0 0 16px; }
  .creator-options { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .creator-options .btn[aria-pressed="true"] { border-color:var(--green); background:#e9f3ed; color:var(--green); }
  .creator-card { border:1px solid var(--line); border-radius:10px; padding:14px; margin:12px 0; background:#fafcf9; }
  .creator-card p:last-child { margin-bottom:0; }
  .creator-path { overflow-wrap:anywhere; font-size:12px; background:#f0f5f1; padding:12px; border-radius:9px; }
  .creation-step { text-align:left; border:1px solid var(--line); background:white; border-radius:11px; padding:12px; color:var(--ink); min-width:0; }
  .knowledge-steps { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .knowledge-inputs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:18px 0; align-items:stretch; }
  .knowledge-input-card { min-width:0; border:1px solid var(--line); border-radius:11px; background:#fafcf9; padding:16px; }
  .knowledge-input-card h3 { margin:0 0 6px; }
  .knowledge-input-card p { margin:0 0 10px; }
  .knowledge-input-card textarea { min-height:112px; }
  .knowledge-input-card .field-label { margin:8px 0 5px; }
  .knowledge-input-card.active { border-color:#91c7a7; background:#f2faf3; }
  .knowledge-source-layout { display:grid; grid-template-columns:minmax(170px,1fr) minmax(0,3fr); gap:15px; margin:18px 0; align-items:start; }
  .knowledge-source-nav { display:grid; align-content:start; gap:6px; max-height:480px; overflow-y:auto; overscroll-behavior:contain; padding:2px 7px 2px 2px; }
  .knowledge-source-nav button,.knowledge-item-list button,.knowledge-tree button { width:100%; border:1px solid var(--line); background:white; color:var(--ink); padding:11px; border-radius:9px; text-align:left; cursor:pointer; overflow-wrap:anywhere; }
  .knowledge-source-nav button[aria-pressed="true"],.knowledge-item-list button[aria-pressed="true"],.knowledge-tree button[aria-pressed="true"] { border-color:var(--green); background:#e9f3ed; box-shadow:inset 3px 0 var(--green); }
  .knowledge-source-nav button small { display:block; width:fit-content; color:#276b48; background:#e2f3e8; border-radius:5px; padding:1px 6px; font-size:11px; margin-top:5px; font-weight:600; }
  .knowledge-source-page { min-width:0; max-height:480px; overflow-y:auto; overscroll-behavior:contain; border:1px solid var(--line); background:#fbfcfa; border-radius:10px; padding:20px 23px; }
  .knowledge-source-page .source-document { font-size:13px; line-height:1.75; overflow-wrap:anywhere; }
  .source-document h1,.source-document h2,.source-document h3 { margin:18px 0 8px; line-height:1.4; }
  .source-document h1:first-child,.source-document h2:first-child,.source-document h3:first-child { margin-top:0; }
  .source-document h1 { font-size:21px; } .source-document h2 { font-size:17px; padding-bottom:7px; border-bottom:1px solid var(--line); } .source-document h3 { font-size:15px; }
  .source-document p { margin:8px 0; white-space:pre-wrap; } .source-document ul,.source-document ol { padding-left:22px; margin:9px 0; }
  .source-document li { margin:4px 0; } .source-document hr { border:0; border-top:1px solid var(--line); margin:16px 0; }
  .source-document code { font:12px/1.55 ui-monospace,SFMono-Regular,monospace; background:#edf3ee; padding:1px 3px; border-radius:3px; }
  .source-document pre { overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; background:#edf3ee; border-radius:8px; padding:12px; }
  .source-document pre code { padding:0; background:none; }
  .source-table-scroll { max-width:100%; overflow-x:auto; margin:12px 0; border:1px solid var(--line); border-radius:8px; }
  .source-document table { border-collapse:collapse; width:100%; min-width:max-content; font-size:12px; }
  .source-document th,.source-document td { border-bottom:1px solid var(--line); padding:8px 11px; text-align:left; vertical-align:top; max-width:290px; white-space:normal; }
  .source-document th { background:#e9f3ed; color:#285c45; } .source-document tr:last-child td { border-bottom:0; }
  .knowledge-item-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin:16px 0; }
  .knowledge-item-list button small { display:block; color:var(--muted); margin-top:5px; }
  .fact-chapter-layout { display:grid; grid-template-columns:minmax(170px,1fr) minmax(0,3fr); gap:15px; align-items:start; margin:18px 0; }

  .fact-lines { border-top:1px solid var(--line); margin-top:18px; }
  .fact-line { display:block; width:100%; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; text-align:left; padding:12px 4px; color:var(--ink); cursor:pointer; }

  .knowledge-change p { margin:6px 0; white-space:pre-wrap; overflow-wrap:anywhere; }

### 1. 原材料价格波动风险

采购与财务已展开成本构成复核，不能据此推断合同已经锁价。
部分交货批次可能受到价格波动影响；需结合有效合同与采购量判断。
下周期拟讨论锁价方式，必须另核合同签订、审批及适用范围。

### 2. 供应链交期风险
产品线 C 的跨境运输存在交付延误预测，但尚无实际停线记录。
团队提出当次改运建议，运输方式与费用分担需回订单和审批记录核实。
替代方案仍在可行性评估，不能将待评项称为已经完成验证。
下周期的到货验收与生产排程应以实际物流和生产系统状态为准。
